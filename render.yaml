services:
  - type: web
    name: dental-backend
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm render:build
    startCommand: corepack enable && pnpm render:start
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: WHATSAPP_ENABLED
        value: "true"
      - key: CORS_ORIGIN
        value: https://dentalappc.netlify.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "86400"
